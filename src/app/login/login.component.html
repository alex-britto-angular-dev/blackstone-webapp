<div class="login-container">

  <h2>Login</h2>

  <input
    type="text"
    [(ngModel)]="username"
    placeholder="Username"
    id="username">

  <br><br>

  <input
    type="password"
    [(ngModel)]="password"
    placeholder="Password"
    id="password">

  <br><br>

  <button
      id="loginBtn"
      (click)="login()">
      Login
  </button>

  <br><br>

  <p>{{message}}</p>

</div>
